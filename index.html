        extend: {

    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-item { transition: all 0.15s ease; }
    .sidebar-item:hover { background: rgba(255,122,14,0.12); }
    .sidebar-item.active { background: rgba(255,122,14,0.2); border-left: 3px solid #ff7a0e; }
    .card { transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #15151a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

    function showSection(id) {
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      const btn = document.querySelector(`[data-section="${id}"]`);
      if (btn) btn.classList.add('active');
      
      const section = sections[id];
      if (!section) return;
      
      document.getElementById('page-title').textContent = section.title;
      document.getElementById('content').innerHTML = section.html;
    }

    function runMine() {
      const q = document.getElementById('mine-query')?.value || 'geral';
